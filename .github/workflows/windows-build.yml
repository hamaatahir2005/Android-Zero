name: Build Windows EXE and Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify project source exists
        shell: pwsh
        run: |
          if (!(Test-Path main.py)) { throw "main.py missing: upload extracted source files to repository root" }
          if (!(Test-Path requirements.txt)) { throw "requirements.txt missing: upload extracted source files to repository root" }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AndroidSecurityLab --add-data "data;data" --add-data "samples;samples" --add-data "rules;rules" main.py
          if (!(Test-Path dist/AndroidSecurityLab.exe)) { throw "EXE missing" }
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing" }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (!(Test-Path installer/AndroidSecurityLab_Setup.exe)) { throw "Installer missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidSecurityLab-Windows
          path: |
            dist/AndroidSecurityLab.exe
            installer/AndroidSecurityLab_Setup.exe
          if-no-files-found: error
